# ~997M parameters (approx_param_count). Per the engineering brief section
# 47, this size is for later exploration as a teacher or larger local
# fallback model, not a day-one training target.
model:
  hidden_size: 1856
  num_layers: 26
  num_heads: 16
  num_kv_heads: 4
  intermediate_size: 4928
  max_seq_len: 4096
  vocab_size: 32000
  attention_type: gqa
  norm_type: rmsnorm
  mlp_type: swiglu
  rope_theta: 10000.0
  tie_embeddings: true
  sliding_window: 0
