# tiny_debug: 115,264 parameters (exact; tinymind.model.config.count_parameters).
# Engineering/CI profile: fast enough to run every test and a 100-step training in seconds. Not meant to be useful.
# The whole architecture is in this file: a checkpoint stores it and refuses to resume under a different one.
# Vocabulary counts toward the mobile budget: the byte tokenizer's 260 ids cost 260 x hidden_size parameters
# (a 32,000-id vocabulary at hidden 192 would spend 6,144,000 parameters on the embedding alone).
profile: tiny_debug
model:
  hidden_size: 64
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  intermediate_size: 192
  max_seq_len: 128
  vocab_size: 260
  attention_type: gqa
  norm_type: rmsnorm
  mlp_type: swiglu
  rope_theta: 10000.0
  tie_embeddings: true
  sliding_window: 0
tokenizer:
  type: byte
training:
  stage: stage0
  batch_size: 8
  max_seq_len: 128
  max_steps: 200
  warmup_steps: 10
  learning_rate: 0.003
  min_learning_rate: 0.0003
  eval_interval: 50
  checkpoint_interval: 50
  log_interval: 10
