[project]
name = "tinymind"
version = "0.1.0-dev"
description = "A mobile-first, tool-aware, structured-output runtime and model stack for tiny local reasoning agents. Phase 3A: a real, trained, gradient-checked reference transformer (see docs/architecture/model-implementation.md) plus the Phase 1 reference runtime."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    # Phase 3A: tinymind.model.tensor's from-scratch autodiff engine (no
    # PyTorch/JAX available in this project's build environment — see that
    # module's docstring) is built directly on NumPy arrays, and
    # tinymind.model is imported transitively from the top-level tinymind
    # package (via tinymind.model.backend) — so this is a real, core
    # dependency now, not an optional extra the way it was in Phase 1.
    "numpy>=1.24",
]

[project.optional-dependencies]
# Structured-output helpers: TinyMind's own tool/schema code works without
# pydantic (see tinymind/tools/schema.py), but will use it when present, the
# same soft-dependency pattern the Needle analysis noted as worth keeping.
pydantic = ["pydantic>=2.0"]
# Everything needed to run tinymind/tests/ locally.
dev = ["pytest>=7.0"]

[project.scripts]
tinymind = "tinymind.cli:main"

[tool.setuptools.packages.find]
include = ["tinymind*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "native: requires a compiled native/ engine (not built in this delivery)",
]
